<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .stats { display: flex; gap: 20px; margin: 20px 0; }
    .stat { flex: 1; padding: 16px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
    .stat .value { font-size: 1.4rem; font-weight: bold; }
    .card { padding: 12px 16px; border-left: 4px solid #2b6cb0; background: #f7fafc; margin: 8px 0; border-radius: 4px; }
    .advice { border-left-color: #d69e2e; background: #fffbea; }
    form { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
    input, select { padding: 8px; margin: 4px 4px 4px 0; }
    nav a { margin-right: 16px; }
  </style>
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/chat">Chat</a>
  </nav>

  <h1>This Week</h1>

  <div class="stats">
    <div class="stat"><div class="value" id="income">—</div>Income</div>
    <div class="stat"><div class="value" id="expenses">—</div>Expenses</div>
    <div class="stat"><div class="value" id="net">—</div>Net</div>
  </div>

  <h3>Insights</h3>
  <div id="insights"></div>

  <h3>Advice</h3>
  <div id="advice"></div>

  <form id="txn-form">
    <h3>Log a Transaction</h3>
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>
    <select id="category">
      <option value="sales">Sales</option>
      <option value="rent">Rent</option>
      <option value="supplies">Supplies</option>
      <option value="transport">Transport</option>
      <option value="salaries">Salaries</option>
      <option value="other">Other</option>
    </select>
    <input type="number" id="amount" placeholder="Amount" required>
    <input type="text" id="note" placeholder="Note (optional)">
    <button type="submit">Add</button>
  </form>

  <script>
    const businessId = {{ business_id }};

    async function loadReport() {
      const res = await fetch(`/api/reports?business_id=${businessId}&period=week`);
      const r = await res.json();
      document.getElementById('income').textContent = `₦${r.total_income.toFixed(0)}`;
      document.getElementById('expenses').textContent = `₦${r.total_expenses.toFixed(0)}`;
      document.getElementById('net').textContent = `₦${r.net.toFixed(0)}`;

      document.getElementById('insights').innerHTML =
        r.insights.map(i => `<div class="card">${i}</div>`).join('') || '<p>No insights yet — log a few transactions.</p>';
      document.getElementById('advice').innerHTML =
        r.advice.map(a => `<div class="card advice">${a}</div>`).join('');
    }

    document.getElementById('txn-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/transactions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          business_id: businessId,
          type: document.getElementById('type').value,
          category: document.getElementById('category').value,
          amount: parseFloat(document.getElementById('amount').value),
          note: document.getElementById('note').value,
        }),
      });
      document.getElementById('amount').value = '';
      document.getElementById('note').value = '';
      loadReport();
    });

    loadReport();
  </script>
</body>
</html>
