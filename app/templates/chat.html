<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    #messages { border: 1px solid #ddd; border-radius: 8px; height: 400px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #f0f2f5; }
    .msg { padding: 8px 12px; border-radius: 12px; margin: 6px 0; max-width: 80%; }
    .user { background: #dcf8c6; margin-left: auto; text-align: right; }
    .bot { background: #fff; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; }
    nav a { margin-right: 16px; }
  </style>
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/chat">Chat</a>
  </nav>

  <h1>WhatsApp-style Chat (simulated)</h1>
  <p style="color:#666; font-size: 0.9rem;">
    Try: "sold 3 sachets, 500 naira" · "spent 1500 on transport" · "how's my week?"
  </p>

  <div id="messages"></div>

  <form id="chat-form">
    <input type="text" id="message" placeholder="Type a message..." required>
    <button type="submit">Send</button>
  </form>

  <script>
    const businessId = {{ business_id }};
    const messagesEl = document.getElementById('messages');

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('message');
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ business_id: businessId, message: text }),
      });
      const data = await res.json();
      addMessage(data.reply, 'bot');
    });
  </script>
</body>
</html>
