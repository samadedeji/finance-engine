<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>[Product Name] — Log In</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.4rem; }
    input, select { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 10px 16px; cursor: pointer; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tabs button { flex: 1; }
    .hidden { display: none; }
    #error { color: #b00020; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Track your business, the easy way</h1>

  <div class="tabs">
    <button onclick="showForm('login')">Log In</button>
    <button onclick="showForm('register')">Register</button>
  </div>

  <form id="login-form">
    <label>Phone Number</label>
    <input type="text" id="login-phone" required>
    <label>Password</label>
    <input type="password" id="login-password" required>
    <button type="submit">Log In</button>
  </form>

  <form id="register-form" class="hidden">
    <label>Business Name</label>
    <input type="text" id="reg-name" required>
    <label>Business Type</label>
    <input type="text" id="reg-type" placeholder="e.g. retail, service">
    <label>Phone Number</label>
    <input type="text" id="reg-phone" required>
    <label>Password</label>
    <input type="password" id="reg-password" required>
    <button type="submit">Register</button>
  </form>

  <div id="error"></div>

  <script>
    function showForm(which) {
      document.getElementById('login-form').classList.toggle('hidden', which !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', which !== 'register');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone_number: document.getElementById('login-phone').value,
          password: document.getElementById('login-password').value,
        }),
      });
      if (res.ok) { window.location.href = '/dashboard'; }
      else { const d = await res.json(); document.getElementById('error').textContent = d.error; }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('reg-name').value,
          business_type: document.getElementById('reg-type').value,
          phone_number: document.getElementById('reg-phone').value,
          password: document.getElementById('reg-password').value,
        }),
      });
      if (res.ok) { window.location.href = '/dashboard'; }
      else { const d = await res.json(); document.getElementById('error').textContent = d.error; }
    });
  </script>
</body>
</html>
